<!doctype html>
<html lang="zh-CN" data-theme="light" data-palette="mint">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>DB MCP · Database Console</title>
    <script>
      (() => {
        let mode = "auto";
        try {
          const saved = localStorage.getItem("linkage-theme");
          if (saved === "light" || saved === "dark") mode = saved;
        } catch { /* 偏好存储可选。 */ }
        document.documentElement.dataset.theme = mode === "dark" ||
          (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        document.documentElement.dataset.palette = "mint";
      })();
    </script>
