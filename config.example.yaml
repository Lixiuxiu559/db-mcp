  #   host: 10.0.0.40
  #   port: 6380
  #   username: app            # Redis 6+ ACL 用户名
  #   password: ${DBMCP_REDIS_ACL_PASSWORD}
  #   database: 1
  #   permissions: write
  #   enabled: false         # 设为 false 可临时禁用
