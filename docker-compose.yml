services:
  db-mcp:
    build: .
    image: lijx559/db-mcp:2.1.0
    restart: unless-stopped
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "127.0.0.1:${DBMCP_PORT:-8807}:8807"
    volumes:
      - ./runtime:/data
    environment:
      TZ: Asia/Shanghai
    # 配置引用的数据库密码环境变量需在此显式注入。
