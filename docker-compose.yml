name: db-mcp
services:
  db-mcp:
    container_name: ${COMPOSE_PROJECT_NAME:-db-mcp}
    image: ${DBMCP_IMAGE:-lijx559/db-mcp:2.2.0}
    restart: unless-stopped
    ports:
      - "${DBMCP_BIND_ADDRESS:-127.0.0.1}:${DBMCP_PORT:-8807}:8807"
    volumes:
      - runtime:/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    stop_grace_period: 20s

volumes:
  runtime:
    name: ${COMPOSE_PROJECT_NAME:-db-mcp}-data
